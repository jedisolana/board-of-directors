# Standard library only, so the rules that matter here are correctness ones.
line-length = 100
target-version = "py310"

[lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes - unused names, undefined names
  "B",         # bugbear - real bug patterns
  "I",         # import sorting
  "UP",        # pyupgrade
  "SIM",       # simplifications
  "C4",        # comprehensions
  "RUF",
]
ignore = [
  "E501",      # line length is enforced by the formatter, not the linter
  "B008",      # function call in default argument - deliberate for the sleep/clock seams
]

[lint.per-file-ignores]
"tests/*" = ["E402"]
