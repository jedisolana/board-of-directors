name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No dependencies to install - it is standard library only, and the suite
      # makes no network calls.
      - name: lint
        run: |
          pip install ruff
          ruff check .
      - name: run the tests
        run: python -m unittest discover -s tests -v
      - name: the console starts from a clean checkout
        run: |
          python -m boardofdirectors.cli --offline board
          python -m boardofdirectors.cli --offline budget

  # A unit test runs against the source tree, so it cannot see what a wheel actually
  # contains. The console shipped as a 404 for exactly that reason: `pip install` left
  # web/index.html behind and every test still passed. This job installs the built
  # artifact into a clean environment and asks the installed copy to serve a page.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build a wheel from a clean tree
        run: |
          rm -rf build dist ./*.egg-info      # setuptools never deletes from build/lib,
          pip install build                   # so a stale tree ships files you removed
          python -m build --wheel
      - name: the wheel carries the assets and nothing else
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = ["boardofdirectors/web/index.html", "boardofdirectors/data/free-models.json"]
          missing = [n for n in need if n not in names]
          tops = {n.split("/")[0] for n in names}
          stray = {t for t in tops if t != "boardofdirectors" and not t.endswith(".dist-info")}
          if missing: sys.exit(f"wheel is missing: {missing}")
          if stray:   sys.exit(f"wheel pollutes site-packages with: {sorted(stray)}")
          print("wheel contents ok:", sorted(tops))
          PY
      - name: the installed console serves a page
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          cd /tmp                             # sys.path[0] is the cwd - from the repo root
                                              # this would import the source, not the install
          BOARD_HOME=$(mktemp -d) /tmp/clean/bin/board ui --port 8499 --no-open &
          for _ in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:8499/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8499/)" = 200
          curl -sf http://127.0.0.1:8499/api/state > /dev/null
          echo "installed console served 200"
