[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "board-of-directors"
version = "0.1.0"
description = "A board of directors made of free models: independent votes, blind ranking, a chair that didn't vote."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "openrouter", "ensemble", "multi-agent", "jury", "mixture-of-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jedisolana/board-of-directors"
Repository = "https://github.com/jedisolana/board-of-directors"
Issues = "https://github.com/jedisolana/board-of-directors/issues"
Changelog = "https://github.com/jedisolana/board-of-directors/blob/main/CHANGELOG.md"

[project.scripts]
board = "boardofdirectors.cli:main"
board-of-directors = "boardofdirectors.cli:main"

[tool.setuptools]
packages = ["boardofdirectors"]

[tool.setuptools.package-data]
# The console's page and the catalogue snapshot are not optional extras - without them a
# `pip install` produces a 404 and no offline fallback. This is the line that ships them.
boardofdirectors = ["web/*.html", "data/*.json"]
